name: Veille publique ANSM

on:
  push:
    paths:
      - 'agent-veille-ansm/**'
      - '.github/workflows/ansm-watch.yml'
      - '!agent-veille-ansm/data/**'
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ansm-public-watch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Synchroniser avec la dernière version de main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-veille-ansm/requirements.txt

      - name: Installer les dépendances
        run: python -m pip install -r agent-veille-ansm/requirements.txt

      - name: Exécuter les tests
        run: python -m unittest discover -s agent-veille-ansm/tests -v

      - name: Collecter les données ANSM
        run: python agent-veille-ansm/src/ansm_watch.py --data-dir agent-veille-ansm/data

      - name: Générer la synthèse IA optionnelle
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
        continue-on-error: true
        run: |
          if [[ -n "$OPENAI_API_KEY" ]]; then
            python -m pip install -r agent-veille-ansm/requirements-ai.txt
            python agent-veille-ansm/src/generate_ai_summary.py --data-dir agent-veille-ansm/data
          else
            echo "OPENAI_API_KEY absent : la collecte continue sans synthèse IA."
          fi

      - name: Enregistrer les instantanés et restitutions
        run: |
          if [[ -n "$(git status --porcelain agent-veille-ansm/data)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add agent-veille-ansm/data
            git commit -m "chore(ansm-watch): update public availability data"
            git push
          else
            echo "Aucun fichier de veille à mettre à jour."
          fi
