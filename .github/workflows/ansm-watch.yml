name: Veille publique ANSM

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install -r agent-veille-ansm/requirements.txt

      - name: Exécuter les tests
        run: python -m unittest discover -s agent-veille-ansm/tests -v

      - name: Collecter les données ANSM
        run: python agent-veille-ansm/src/ansm_watch.py --data-dir agent-veille-ansm/data

      - name: Enregistrer les changements détectés
        run: |
          if [[ -n "$(git status --porcelain agent-veille-ansm/data)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add agent-veille-ansm/data
            git commit -m "chore: update ANSM public availability watch"
            git push
          else
            echo "Aucun changement dans les données publiques ANSM."
          fi
